name: RunPlugin
version: '1.0-SNAPSHOT'
main: de.schnorrenbergers.run.RunPlugin
api-version: '26.3'
commands:
  lotto:
    description: Lotto 4 aus 15 - mit Bits tippen, wer alle vier trifft, bekommt den Topf
    usage: /lotto [tipp <a> <b> <c> <d>|quick [anzahl]|info|meine]
  ticket:
    description: Tickets schreiben, lesen und beantworten - dieselben wie auf Discord
    usage: /ticket [neu|offen|<nr> [antworten|schliessen|oeffnen|uebernehmen]]
    aliases: [tickets]
  neustart:
    description: Das ganze Netzwerk zu einer Zeit neu starten, mit oder ohne Update
    usage: /neustart <minuten> [update|aus] | /neustart abbrechen
    permission: network.restart
  reset:
    description: Setzt diesen Event-Server zurück
    usage: /reset
  events:
    description: Den Eventkalender öffnen
    usage: /events
  warp:
    description: Auf einen anderen Server springen
    usage: /warp [server]
  lobby:
    description: Zurück in die Lobby
    usage: /lobby
    aliases: [hub, leave]
  servermanger:
    description: Server verwalten und neue Server erstellen
permissions:
  network.lotto.admin:
    description: Das Lotto ziehen und Preis und Termin einstellen
    default: op
  network.tickets:
    description: Tickets aller Spieler sehen, beantworten und übernehmen
    default: op
  network.restart:
    description: Das Netzwerk neu starten
    default: op
  network.warp.always:
    description: Darf jeden Server jederzeit verlassen
    default: op
