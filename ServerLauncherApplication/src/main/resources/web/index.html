<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MCServer Administration</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>

<!-- The login. Password and authenticator code are always sent together, because the server refuses to
     look at a password without a valid code. -->
<main id="login-view" class="login-view hidden">
    <form id="login-form" class="card login-card" autocomplete="off">
        <h1>MCServer</h1>
        <p class="muted">Anmeldung mit Passwort und Google Authenticator.</p>

        <label for="login-username">Benutzername</label>
        <input id="login-username" name="username" type="text" autocomplete="username" required>

        <label for="login-password">Passwort</label>
        <input id="login-password" name="password" type="password" autocomplete="current-password" required>

        <label for="login-token">Google Authenticator Code</label>
        <input id="login-token" name="token" type="text" inputmode="numeric" pattern="[0-9]*"
               maxlength="8" autocomplete="one-time-code" required>
        <p class="hint">Ohne diesen Code wird das Passwort gar nicht erst geprüft.</p>

        <button id="login-submit" type="submit">Anmelden</button>
        <p id="login-message" class="message hidden"></p>
    </form>
</main>

<!-- The interface itself. The navigation is built from the modules the server reports, so a new module
     appears here on its own. -->
<div id="app-view" class="app hidden">
    <header class="topbar">
        <span class="brand">MCServer Administration</span>
        <nav id="nav" class="nav"></nav>
        <span class="spacer"></span>
        <span id="current-user" class="muted"></span>
        <button id="logout" type="button" class="secondary">Abmelden</button>
    </header>
    <main id="panel" class="panel"></main>
    <p id="toast" class="toast hidden"></p>
</div>

<script src="/app.js"></script>
</body>
</html>
