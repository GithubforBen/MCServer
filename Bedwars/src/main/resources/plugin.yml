name: Bedwars
version: '1.0-SNAPSHOT'
main: de.schnorrenbergers.bedwars.Bedwars
api-version: '26.3'
commands:
  neustart:
    description: Das ganze Netzwerk zu einer Zeit neu starten, mit oder ohne Update
    usage: /neustart <minuten> [update|aus] | /neustart abbrechen
    permission: network.restart
  cosmetics:
    description: Cosmetics kaufen, anlegen und ablegen
    usage: /cosmetics [win_effect|kill_effect|trail|gadget|neu|verwalten]
    aliases: [cosmetic]
  bw:
    description: Verwaltet die Bedwars Runde auf diesem Server
    usage: /bw <status|start|stop|setup|reload|addons|addon|generators|timeline|shop|upgrades|stats|watch>
    aliases: [bedwars]
  warp:
    description: Auf einen anderen Server springen
    usage: /warp [server]
  lobby:
    description: Zurück in die Lobby
    usage: /lobby
    aliases: [hub, leave]
permissions:
  network.restart:
    description: Das Netzwerk neu starten
    default: op
  bedwars.admin:
    description: Darf die Runde und die Addons verwalten
    default: op
  network.warp.always:
    description: Darf jeden Server jederzeit verlassen
    default: op
