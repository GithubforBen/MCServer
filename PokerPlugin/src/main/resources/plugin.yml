name: PokerPlugin
version: '1.0-SNAPSHOT'
main: de.schnorrenbergers.poker.PokerPlugin
api-version: '26.2'
commands:
  poker:
    description: Einsätze, nachkaufen, aufstehen, Bots und die Karte
    usage: /poker [info|nachkaufen|aufstehen|bot|setup|karte]
  events:
    description: Den Eventkalender öffnen
    usage: /events
  warp:
    description: Auf einen anderen Server springen
    usage: /warp [server]
  lobby:
    description: Zurück in die Lobby
    usage: /lobby
    aliases: [hub, leave]
  servermanger:
    description: Server verwalten und neue Server erstellen
permissions:
  network.warp.always:
    description: Darf jeden Server jederzeit verlassen
    default: op
