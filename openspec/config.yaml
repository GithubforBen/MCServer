schema: specfold

context: |
  Language: English. All artifacts are written in English; keep OpenSpec headings and SHALL/MUST in English.
  Rather ask than assume: when the request, knowledge or specs leave a decision open, ask the user (one decision per question, recommended option first).
  Project knowledge lives in knowledge/ (OKF v0.2). Start at knowledge/index.md.
  Behavior contracts live in openspec/specs/. Knowledge never restates requirements.
  Stack: Java 25, Maven, Paper- und Velocity-Plugins

rules:
  proposal:
    - Link the knowledge concepts and decisions this change relies on (bundle-absolute paths such as /decisions/x.md).
    - Check knowledge/decisions/ for a rejected decision covering the same idea; if one exists, say why this differs.
  specs:
    - Observable behavior only. Rationale goes to the capability card via knowledge.md.
  design:
    - Look up the open deferred commitments this change touches (specfold commitments list, specfold lookup) and record each in `## Commitments` as kept or blocked; write `none` when none is touched.
  knowledge:
    - List every concept to create, update or deprecate. An empty list needs a one-line reason.
  tasks:
    - Every group owns its files; groups that may run in parallel never share files.
    - Last task group is always "Knowledge"; `specfold sync <change>` goes into "Workflow follow-up".

operations:
  apply:
    guidance:
      - Add new findings to knowledge.md while implementing, not afterwards.
      - When a task is ambiguous, stop and ask the user instead of guessing.
  archive:
    guidance:
      - After archiving, run `specfold sync <change>` and commit its result in the same PR.
